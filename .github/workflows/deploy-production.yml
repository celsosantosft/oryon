name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Oryon
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Validate frontend build
        run: |
          npm ci --prefix client
          npm run build --prefix client

      - name: Validate backend install and syntax
        run: |
          npm ci --prefix server --omit=dev
          node --check server/server.js

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Configure DEPLOY_HOST in GitHub Actions secrets.}"
          : "${DEPLOY_SSH_KEY:?Configure DEPLOY_SSH_KEY in GitHub Actions secrets.}"

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/oryon_deploy_key
          chmod 600 ~/.ssh/oryon_deploy_key

          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SECONDARY_DEPLOY_PATH: ${{ secrets.SECONDARY_DEPLOY_PATH }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_USER="${DEPLOY_USER:-root}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/oryon}"
          SECONDARY_DEPLOY_PATH="${SECONDARY_DEPLOY_PATH:-/var/www/pd-fardamentos}"

          ssh -i ~/.ssh/oryon_deploy_key \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "bash -s -- '$TARGET_COMMIT' '$DEPLOY_PATH' '$SECONDARY_DEPLOY_PATH'" <<'REMOTE'
          set -euo pipefail

          TARGET_COMMIT="$1"
          PRIMARY_APP_DIR="$2"
          SECONDARY_APP_DIR="$3"

          deploy_target() {
              local app_dir="$1"
              local pm2_name="$2"
              local healthcheck_url="$3"
              local branding_source="${4:-}"
              local branding_target="${5:-}"
              local app_theme="${6:-}"

              cd "$app_dir"
              echo "Deploying commit $TARGET_COMMIT in $app_dir"

              git fetch origin main
              git checkout main
              git reset --hard "$TARGET_COMMIT"

              if [ -n "$app_theme" ]; then
                  if grep -q '^VITE_APP_THEME=' .env; then
                      sed -i "s/^VITE_APP_THEME=.*/VITE_APP_THEME=$app_theme/" .env
                  else
                      printf '\nVITE_APP_THEME=%s\n' "$app_theme" >> .env
                  fi
              fi

              APP_DIR="$app_dir" \
              PM2_APP_NAME="$pm2_name" \
              HEALTHCHECK_URL="$healthcheck_url" \
              BRANDING_SOURCE_DIR="$branding_source" \
              BRANDING_TARGET_DIR="$branding_target" \
              bash scripts/deploy-production.sh
          }

          deploy_target "$PRIMARY_APP_DIR" "oryon-server" "https://atosfardamentos.com.br/login"

          if [ ! -f "/var/lib/oryon/pd-fardamentos/.bootstrap-complete" ]; then
              bash "$PRIMARY_APP_DIR/scripts/bootstrap-pd-fardamentos.sh" \
                  "$PRIMARY_APP_DIR" \
                  "$SECONDARY_APP_DIR" \
                  "$TARGET_COMMIT"
          elif [ -d "$SECONDARY_APP_DIR/.git" ]; then
              deploy_target \
                  "$SECONDARY_APP_DIR" \
                  "pd-fardamentos-server" \
                  "https://pdfardamentos.com.br/login" \
                  "$SECONDARY_APP_DIR/deploy/branding/pd-fardamentos" \
                  "/var/lib/oryon/pd-fardamentos/branding" \
                  "monochrome"
          else
              echo "Invalid secondary installation: $SECONDARY_APP_DIR" >&2
              exit 1
          fi
          REMOTE
