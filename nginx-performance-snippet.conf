# Performance para o front Vite do Oryon ERP.
# Coloque dentro do bloco `server { ... }` do site no Nginx.
# Depois valide com `sudo nginx -t` e recarregue com `sudo systemctl reload nginx`.

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff
    font/woff2;

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
}

location ~* ^/assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|txt)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}

